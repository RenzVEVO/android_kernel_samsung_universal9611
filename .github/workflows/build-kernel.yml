name: Build Exynos 9611 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device for the kernel build'
        type: choice
        required: true
        options:
          - a51
          - f41
          - m31s
          - gta4xl
          - gta4xlwifi
          - m21
        default: 'a51'
      oneui:
        description: 'Build for OneUI (Default is AOSP variant)'
        type: boolean
        default: false
      allow_dirty:
        description: 'Allow dirty build (kernel sources not wiped, use with caution)'
        type: boolean
        default: false
      permissive:
        description: 'Build kernel with permissive SELinux policy'
        type: boolean
        default: false

jobs:
  build_kernel:
    name: Build for ${{ github.event.inputs.device }}
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install general dependencies
        run: |
          sudo apt-get update
          # Added libarchive-tools as requested, and kept previous dependencies
          sudo apt-get install -y git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python-is-python3 libarchive-tools # Dependencies from the compilation guide [1] and user feedback

      - name: Clone kernel repository with submodules
        uses: actions/checkout@v4
        with:
          repository: Exynos9611Development/android_kernel_samsung_universal9611 # The kernel source [1]
          path: android_kernel_samsung_universal9611 # Clones into this subdirectory
          submodules: 'recursive' # This is crucial for fetching AnyKernel3 contents

      - name: Verify AnyKernel3 checkout
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing contents of checked-out kernel source:"
          ls -la
          echo "Checking AnyKernel3 directory and anykernel.sh:"
          if [ ! -d "AnyKernel3" ]; then
            echo "Error: AnyKernel3 directory is STILL missing after checkout with submodules."
            exit 1
          fi
          if [ ! -f "AnyKernel3/anykernel.sh" ]; then
            echo "Error: AnyKernel3/anykernel.sh is STILL missing after checkout with submodules."
            echo "Contents of AnyKernel3 directory:"
            ls -la AnyKernel3/
            exit 1
          fi
          echo "AnyKernel3 directory and anykernel.sh found successfully."

      - name: Setup Clang Toolchain (Neutron with Antman)
        working-directory: ./android_kernel_samsung_universal9611 # The build_kernel.py script expects 'toolchain' here
        run: |
          set -e # Exit immediately if a command exits with a non-zero status.
          echo "Creating toolchain directory..."
          mkdir toolchain
          cd toolchain # All antman commands should run from within the 'toolchain' directory
          
          echo "Current directory for antman: $(pwd)"
          
          echo "Running antman -S=10032024 (downloading Neutron Clang)..."
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          
          echo "Running antman --patch=glibc (patching for glibc)..."
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          
          echo "Toolchain setup with antman finished."
          echo "Verifying toolchain contents..."
          # Check for clang, if it's directly in toolchain/bin or a subdirectory like toolchain/neutron-clang/bin
          if [ -f "bin/clang" ] || [ -f */bin/clang ]; then
            echo "Clang binary found in toolchain."
            echo "Contents of toolchain directory:"
            ls -la
            if [ -d "bin" ]; then
              echo "Contents of toolchain/bin:"
              ls -la bin
            fi
            # Also list subdirectories if neutron-clang was created
             if compgen -G "*/bin/clang" > /dev/null; then
              CLANG_DIR=$(dirname -- "$(find . -name clang -type f -print -quit)")
              CLANG_DIR=$(dirname -- "$CLANG_DIR") # Go up to the main toolchain folder (e.g., neutron-clang)
              echo "Detected clang in subdirectory: $CLANG_DIR"
              echo "Contents of $CLANG_DIR:"
              ls -la "$CLANG_DIR"
              echo "Contents of $CLANG_DIR/bin:"
              ls -la "$CLANG_DIR/bin"
            fi
          else
            echo "Error: Clang binary was NOT found in toolchain/bin or toolchain/*/bin after antman script execution."
            echo "Contents of toolchain directory:"
            ls -la
            exit 1
          fi
          cd .. # Go back to android_kernel_samsung_universal9611 directory

      - name: Build kernel
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          echo "Current directory before build: $(pwd)"
          echo "Listing contents to ensure everything is in place:"
          ls -la
          echo "Checking AnyKernel3 again:"
          ls -la AnyKernel3/
          echo "Checking toolchain again:"
          ls -la toolchain/
          # More specific check based on antman's typical output structure (often creates a subdir like 'neutron-clang')
          if compgen -G "toolchain/*/bin/clang" > /dev/null; then
            echo "Clang found in toolchain subdirectory."
          elif [ -f "toolchain/bin/clang" ]; then
            echo "Clang found directly in toolchain/bin."
          else
            echo "CRITICAL: toolchain/bin/clang or toolchain/*/bin/clang not found right before build!"
            exit 1
          fi

          ADDITIONAL_FLAGS=""
          if ${{ github.event.inputs.oneui == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --oneui"
          fi
          if ${{ github.event.inputs.allow_dirty == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --allow-dirty"
          fi
          if ${{ github.event.inputs.permissive == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --permissive"
          fi
          
          echo "Building kernel for target: ${{ github.event.inputs.device }} with additional flags: $ADDITIONAL_FLAGS"
          python3 build_kernel.py --target=${{ github.event.inputs.device }} $ADDITIONAL_FLAGS # Build command from the guide [1]

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip-${{ github.event.inputs.device }}
          path: ./android_kernel_samsung_universal9611/SN_*.zip
          if-no-files-found: error
