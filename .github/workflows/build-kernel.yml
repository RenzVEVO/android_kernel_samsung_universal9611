name: Build Exynos 9611 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device for the kernel build'
        type: choice
        required: true
        options: 
          - a515f
          - a515s
          - f415f
          - m315f 
          - m317f
          - gta4xl
          - gta4xlwifi
          - m215f
        default: 'a515f'
      oneui:
        description: 'Build for OneUI (Default is AOSP variant)'
        type: boolean
        default: false
      allow_dirty:
        description: 'Allow dirty build (kernel sources not wiped, use with caution)'
        type: boolean
        default: false
      permissive:
        description: 'Build kernel with permissive SELinux policy'
        type: boolean
        default: false
      verbose_build:
        description: 'Enable verbose output from build_kernel.py (if supported)'
        type: boolean
        default: false

jobs:
  build_kernel:
    name: Build for ${{ github.event.inputs.device }}
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install general dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python-is-python3 libarchive-tools # Dependencies from the compilation guide [1] and user feedback

      - name: Clone kernel repository with submodules
        uses: actions/checkout@v4
        with:
          repository: Exynos9611Development/android_kernel_samsung_universal9611 # The kernel source [1]
          path: android_kernel_samsung_universal9611
          submodules: 'recursive'

      - name: Verify AnyKernel3 checkout
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          echo "Checking AnyKernel3 directory and anykernel.sh..."
          if [ ! -f "AnyKernel3/anykernel.sh" ]; then
            echo "Error: AnyKernel3/anykernel.sh is missing after checkout with submodules."
            echo "Contents of AnyKernel3 directory:"
            ls -la AnyKernel3/
            exit 1
          fi
          echo "AnyKernel3/anykernel.sh found successfully."

      - name: Setup Clang Toolchain (Neutron with Antman)
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          set -e 
          echo "Creating toolchain directory..."
          mkdir toolchain
          cd toolchain
          echo "Current directory for antman: $(pwd)"
          echo "Running antman -S=10032024 (downloading Neutron Clang)..."
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          echo "Running antman --patch=glibc (patching for glibc)..."
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          echo "Toolchain setup with antman finished."
          echo "Verifying toolchain contents..."
          if [ -f "bin/clang" ] || compgen -G "*/bin/clang" > /dev/null; then
            echo "Clang binary found in toolchain."
          else
            echo "Error: Clang binary was NOT found in toolchain/bin or toolchain/*/bin after antman script execution."
            ls -la # List contents of toolchain
            if compgen -G "*/bin" > /dev/null; then ls -la */bin; fi # List contents of any */bin directory
            exit 1
          fi
          cd ..

      - name: Build kernel
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          ADDITIONAL_FLAGS=""
          if ${{ github.event.inputs.oneui == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --oneui"
          fi
          if ${{ github.event.inputs.allow_dirty == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --allow-dirty"
          fi
          if ${{ github.event.inputs.permissive == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --permissive"
          fi

          VERBOSE_FLAG=""
          if ${{ github.event.inputs.verbose_build == true }}; then
            VERBOSE_FLAG="-v" # Speculative verbose flag
          fi
          
          echo "Building kernel for target: ${{ github.event.inputs.device }} with additional flags: $ADDITIONAL_FLAGS $VERBOSE_FLAG"
          # Added $VERBOSE_FLAG to the build command
          python3 build_kernel.py --target=${{ github.event.inputs.device }} $ADDITIONAL_FLAGS $VERBOSE_FLAG # Build command from the guide [1]

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip-${{ github.event.inputs.device }}
          path: ./android_kernel_samsung_universal9611/SN_*.zip
          if-no-files-found: error
