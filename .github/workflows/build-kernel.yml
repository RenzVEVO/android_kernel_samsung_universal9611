name: Build Exynos 9611 Kernel with Advanced Features

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device for the kernel build'
        type: choice
        required: true
        options:
          - a51
          - f41
          - m31
          - m31s
          - gta4xl
          - gta4xlwifi
          - m21
        default: 'a51'
      oneui:
        description: 'Build for OneUI (Default is AOSP variant)'
        type: boolean
        default: false
      allow_dirty:
        description: 'Allow dirty build (kernel sources not wiped, use with caution)'
        type: boolean
        default: false
      permissive:
        description: 'Build kernel with permissive SELinux policy'
        type: boolean
        default: false
      verbose_build:
        description: 'Enable verbose output from build_kernel.py (if supported)'
        type: boolean
        default: false
      build_method: # From OnePlus
        description: 'Build method (perf for non-GKI, gki otherwise). Exynos 9611 is non-GKI.'
        type: choice
        required: true
        default: perf
        options:
          - perf
          - gki
      susfs_ci: # From OnePlus
        description: 'Download SUSFS module from CI (true) or Release (false)?'
        type: boolean
        default: true
      vfs_hooks: # From OnePlus (VFS)
        description: 'Enable manual syscall hooks (VFS patches)?'
        type: boolean
        default: true
      kpm_enable: # From OnePlus (KPM)
        description: 'Enable Kernel Patch Manager (KPM)?'
        type: boolean
        default: true
      zram_features: # From OnePlus (ZRAM)
        description: 'Enable additional ZRAM algorithms and features (LZ4KD)?'
        type: boolean
        default: false

jobs:
  build_kernel:
    name: Build for ${{ github.event.inputs.device }} (${{ github.event.inputs.build_method }})
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192 # Increased for potentially larger source/toolchain
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'

      - name: Install general dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make libssl-dev curl bc pkg-config m4 libtool automake autoconf python-is-python3 libarchive-tools jq wget # Added jq for SUSFS CI download

      - name: Clone kernel repository with submodules
        uses: actions/checkout@v4
        with:
          repository: Exynos9611Development/android_kernel_samsung_universal9611
          path: android_kernel_samsung_universal9611
          submodules: 'recursive' # Ensures AnyKernel3 is cloned

      - name: Setup Clang Toolchain (Neutron with Antman)
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          set -e 
          mkdir toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "CLANG_PATH=$(pwd)/toolchain" >> $GITHUB_ENV # Export for build_kernel.py if it needs it explicitly
          echo "Antman toolchain setup complete. Clang version:"
          ./toolchain/bin/clang --version

      # --- SukiSU Ultra / KernelSU Integration ---
      - name: Add KernelSU (SukiSU Ultra)
        if: ${{ github.event.inputs.kpm_enable == true || github.event.inputs.vfs_hooks == true }} # KSU is base for KPM/VFS
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-dev
          cd ./KernelSU
          # Calculate KSU_VERSION (adapted from OnePlus script, ensure 'main' is the correct branch for SukiSU-Ultra/KernelSU)
          LATEST_KSU_TAG=$(git describe --tags --abbrev=0) # Get latest tag, e.g., v0.9.2
          KSU_MAIN_COMMITS=$(git rev-list --count HEAD) # Commits on main/current branch of KernelSU
          KSU_VERSION_NUMBER=${LATEST_KSU_TAG//[^0-9]/} # Extract numbers from tag, e.g., 092
          # This KSU_VERSION logic is a bit arbitrary from the OP script, might need adjustment based on how SukiSU Ultra versioning actually works.
          # A simpler approach might be to use the latest tag or a fixed known-good commit.
          # For now, using a simplified version based on commits, similar to KernelSU's own common practice
          # Let's assume 10000 + commits as a base, similar to official KernelSU
          KSU_COMMIT_COUNT=$(git rev-list --count HEAD)
          CALCULATED_KSU_VERSION=$((10000 + KSU_COMMIT_COUNT))
          echo "Derived KSU_VERSION: $CALCULATED_KSU_VERSION (from $KSU_COMMIT_COUNT commits)"
          echo "KSUVER=$CALCULATED_KSU_VERSION" >> $GITHUB_ENV
          # Update Makefile if SukiSU Ultra uses this convention
          if [ -f "kernel/Makefile" ]; then
            sed -i "s/define KSU_VERSION .*/define KSU_VERSION ${CALCULATED_KSU_VERSION}/g" kernel/Makefile
            echo "Updated KernelSU/kernel/Makefile with KSU_VERSION ${CALCULATED_KSU_VERSION}"
          else
            echo "KernelSU/kernel/Makefile not found, skipping KSU_VERSION update in Makefile."
          fi
          echo "KernelSU (SukiSU Ultra) setup script executed."

      - name: Apply SukiSU Ultra Patches (SUSFS, Hide, VFS)
        if: ${{ github.event.inputs.kpm_enable == true || github.event.inputs.vfs_hooks == true }} # Only if KSU is added
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.10 # Adjust branch as needed, Exynos is 4.14, may need different patches
          git clone https://github.com/ShirkNeko/SukiSU_patch.git

          echo "Applying SUSFS patches..."
          # Note: Original patches are for GKI 5.10. These might not apply to Exynos 4.14.
          # This section WILL LIKELY REQUIRE significant adjustments or different patch sources for Exynos 4.14.
          # For demonstration, I'm adapting paths. If patches fail, this is the first place to debug.
          # cp ./susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch ./
          # cp -R ./susfs4ksu/kernel_patches/fs/* ./fs/
          # cp -R ./susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          # patch -p1 < 50_add_susfs_in_gki-android13-5.10.patch || echo "SUSFS base patch failed or already applied"

          if [ "${{ github.event.inputs.vfs_hooks }}" = "true" ]; then
            echo "Applying Hide Stuff patches..."
            cp ./SukiSU_patch/69_hide_stuff.patch ./
            patch -p1 -F 3 < 69_hide_stuff.patch || echo "Hide stuff patch failed or already applied"
            
            echo "Applying VFS (syscall_hooks) patches..."
            cp ./SukiSU_patch/hooks/syscall_hooks.patch ./
            patch -p1 -F 3 < syscall_hooks.patch || echo "VFS patch failed or already applied"
          fi
          echo "SukiSU patches applied (or attempted)."

      - name: Apply ZRAM Patches (LZ4KD)
        if: ${{ github.event.inputs.zram_features == true }}
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          # Ensure SukiSU_patch is cloned if not done by previous step
          if [ ! -d "SukiSU_patch" ]; then
            git clone https://github.com/ShirkNeko/SukiSU_patch.git
          fi
          echo "Applying ZRAM (LZ4KD) patches..."
          # ZRAM patches from SukiSU_patch are for specific kernel versions (e.g., 5.10, 5.15). 
          # The Exynos 9611 kernel is 4.14. These patches are unlikely to apply directly.
          # This section requires ZRAM patches compatible with kernel 4.14.
          # As a placeholder, copying logic but expecting it to fail or need different patches:
          # KERNEL_VERSION_SIMPLE="4.14" # For Exynos 9611
          # if [ -f "./SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION_SIMPLE}/lz4kd.patch" ]; then
          #   cp ./SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION_SIMPLE}/lz4kd.patch ./
          #   patch -p1 -F 3 < lz4kd.patch || echo "LZ4KD patch failed or already applied"
          #   echo "LZ4KD patches applied for 4.14 (if available)."
          # else
          #   echo "No specific LZ4KD patch found for 4.14 in SukiSU_patch. ZRAM features might be limited."
          # fi
          echo "ZRAM patch application attempted. (WARNING: Patches for 4.14 are likely needed and not standard in SukiSU_patch for this version)"

      - name: Add Configuration Settings to Defconfig
        if: ${{ github.event.inputs.kpm_enable == true || github.event.inputs.vfs_hooks == true || github.event.inputs.zram_features == true }}
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          CONFIG_FILE="arch/arm64/configs/universal9611_defconfig"
          echo "Modifying $CONFIG_FILE..."

          if ${{ github.event.inputs.kpm_enable == true || github.event.inputs.vfs_hooks == true }}; then
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          fi
          if ${{ github.event.inputs.kpm_enable == true }}; then
            echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          fi
          if ${{ github.event.inputs.vfs_hooks == false }} && ${{ github.event.inputs.kpm_enable == true }}; then # Kprobes if KPM is on but VFS is off
            echo "CONFIG_KPROBES=y" >> "$CONFIG_FILE"
          fi

          if ${{ github.event.inputs.vfs_hooks == true }}; then
            echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> "$CONFIG_FILE" # Typical for VFS
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            # Add other SUSFS related configs from OnePlus workflow if VFS is true
            echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> "$CONFIG_FILE"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            # ... (add other CONFIG_KSU_SUSFS_* options as needed) ...
          elif ${{ github.event.inputs.kpm_enable == true }}; then # VFS false but KPM true
             echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> "$CONFIG_FILE"
          fi
          
          if ${{ github.event.inputs.zram_features == true }}; then
            echo "# ZRAM Extra Features Configs (for 4.14, may need adjustment)" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE" # Example, actual 4.14 options might differ
            echo "CONFIG_CRYPTO_LZ4=y" >> "$CONFIG_FILE"    # Ensure base LZ4 is enabled
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            # LZ4KD specific configs might not exist or might be different for 4.14
            # echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE" (If such a module exists for 4.14)
            # echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE" (If such a module exists for 4.14)
            echo "CONFIG_ZRAM_DEF_COMP_LZ4=y" >> "$CONFIG_FILE" # Default to LZ4 if lz4kd not available/patched
          fi

          # Remove check_defconfig from build.config.universal9611 (specific to Exynos build script)
          # The Exynos script uses build.config.device files, not build.config.gki
          # Assuming build_kernel.py calls 'make universal9611_defconfig'
          # If 'check_defconfig' is an issue, it's usually in the main Makefile or a script that calls 'make defconfig'
          # For now, this is a placeholder, as it's unclear if this is needed for Exynos.
          # sed -i 's/check_defconfig//' build.config.universal9611 # Path needs verification

          echo "Defconfig modifications complete."
          cat "$CONFIG_FILE" # Display defconfig changes

      - name: Build kernel
        working-directory: ./android_kernel_samsung_universal9611
        run: |
          ADDITIONAL_FLAGS=""
          if ${{ github.event.inputs.oneui == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --oneui"
          fi
          if ${{ github.event.inputs.allow_dirty == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --allow-dirty"
          fi
          if ${{ github.event.inputs.permissive == true }}; then
            ADDITIONAL_FLAGS="$ADDITIONAL_FLAGS --permissive"
          fi
          VERBOSE_FLAG=""
          if ${{ github.event.inputs.verbose_build == true }}; then
            VERBOSE_FLAG="-v" 
          fi
          
          echo "Building kernel for target: ${{ github.event.inputs.device }} with additional flags: $ADDITIONAL_FLAGS $VERBOSE_FLAG"
          # The build_kernel.py script handles copying Image.gz-dtb to AnyKernel3
          python3 build_kernel.py --target=${{ github.event.inputs.device }} $ADDITIONAL_FLAGS $VERBOSE_FLAG

      - name: Apply KPM Patch to Image (if enabled)
        if: ${{ github.event.inputs.kpm_enable == true }}
        working-directory: ./android_kernel_samsung_universal9611/AnyKernel3 # Image.gz-dtb is here
        run: |
          echo "Attempting to apply KPM patch_linux to Image.gz-dtb..."
          curl -LO https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.11-beta/patch_linux
          chmod +x patch_linux
          
          if [ -f "Image.gz-dtb" ]; then
            mv Image.gz-dtb oImage.gz-dtb # Backup original
            ./patch_linux # This script needs to be able to handle Image.gz-dtb or we need raw Image
            # If patch_linux outputs a new file named 'Image' or similar, rename it.
            # Assuming patch_linux modifies oImage.gz-dtb in place or creates a known output.
            # If it creates 'Image', then: mv Image Image.gz-dtb
            # For now, assume it patches 'oImage.gz-dtb' and the result is still named 'oImage.gz-dtb' or it outputs 'Image'
            if [ -f "Image" ]; then # If patch_linux created a raw "Image"
                echo "patch_linux created 'Image'. Moving it to Image.gz-dtb. THIS MAY BE PROBLEMATIC if compression/dtb is lost."
                mv Image Image.gz-dtb
            elif [ -f "oImage.gz-dtb" ]; then # If it modified the original in place (unlikely) or failed to make new one.
                echo "patch_linux finished. Check if oImage.gz-dtb was patched or if a new Image file was created."
                # If patch_linux renames output to Image.gz-dtb or modifies oImage.gz-dtb, this is fine.
                # This step is highly dependent on how patch_linux behaves.
            fi
            echo "KPM patch applied (or attempted)."
          else
            echo "Image.gz-dtb not found in AnyKernel3 for KPM patching. Build might have failed."
            exit 1
          fi

      - name: Download SUSFS Module
        if: ${{ github.event.inputs.kpm_enable == true || github.event.inputs.vfs_hooks == true }} # Only if KSU features are active
        working-directory: ./android_kernel_samsung_universal9611/AnyKernel3
        run: |
          if ${{ github.event.inputs.susfs_ci == true }}; then
            echo "Downloading Latest SUSFS Module from CI (sidex15/susfs4ksu-module)..."
            LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
              jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1) # Ensure branch name is correct

            if [ -z "$LATEST_RUN_ID" ]; then
              echo "No successful CI run found for sidex15/susfs4ksu-module branch v1.5.2+. Trying release fallback."
              wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip -O ksu_module_susfs.zip || echo "Release download also failed."
            else
              ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[] | select(.name=="ksu_module_susfs") | .archive_download_url') # Assuming artifact is named 'ksu_module_susfs'
              
              if [ -z "$ARTIFACT_URL" ] || [ "$ARTIFACT_URL" == "null" ]; then
                echo "Could not find 'ksu_module_susfs' artifact URL. Trying release fallback."
                wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip -O ksu_module_susfs.zip || echo "Release download also failed."
              else
                curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs.zip "$ARTIFACT_URL"
              fi
            fi
          else
            echo "Downloading Latest SUSFS Module from Release (sidex15/ksu_module_susfs)..."
            wget https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip -O ksu_module_susfs.zip || echo "Release download failed."
          fi

          if [ -f "ksu_module_susfs.zip" ]; then
            echo "SUSFS module downloaded."
          else
            echo "Failed to download SUSFS module."
          fi

      - name: Set Suffix for Artifact Name
        id: suffix
        run: |
          val=""
          if ${{ github.event.inputs.kpm_enable == true }}; then val="${val}_KPM"; fi
          if ${{ github.event.inputs.vfs_hooks == true }}; then val="${val}_VFS"; fi
          if ${{ github.event.inputs.zram_features == true }}; then val="${val}_LZ4KD"; fi
          echo "value=${val}" >> $GITHUB_OUTPUT

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Exynos9611_Kernel_${{ github.event.inputs.device }}${{ steps.suffix.outputs.value }}_KSU${{ env.KSUVER }}
          # build_kernel.py creates SN_....zip in the root of android_kernel_samsung_universal9611
          # AnyKernel3 is a submodule and is zipped by build_kernel.py itself.
          path: ./android_kernel_samsung_universal9611/SN_*.zip
          if-no-files-found: error
